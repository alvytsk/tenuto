name: Security audit

on:
  schedule:
    - cron: "0 8 * * 1" # every Monday at 08:00 UTC
  push:
    paths:
      - "Cargo.lock"
  pull_request:
    paths:
      - "Cargo.lock"
  # Dispatch is the one way to re-audit without a Cargo.lock change: after
  # a RustSec database update, or before a release.
  workflow_dispatch:

# audit-check reports through a check run on push and pull_request, and
# opens an issue per advisory on the scheduled run.
permissions:
  contents: read
  checks: write
  issues: write

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
