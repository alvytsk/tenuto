name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install ALSA development headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  # Linux and macOS are separate jobs rather than one matrix so that the
  # expensive jobs can depend on Linux alone. `needs` waits for a whole
  # matrix, so gating on a two-leg `test` would have made packaging wait for
  # the slower, deliberately non-gating macOS leg — and a red macOS leg could
  # then skip packaging entirely.
  test-linux:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install ALSA development headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
      # --no-fail-fast: cargo otherwise stops at the first test binary that
      # fails, so a red leg only ever showed its first failing binary and
      # hid whatever the later ones would have reported.
      - run: cargo test --locked --no-fail-fast

  # Linux is the verified platform. The macOS leg reports but does not gate:
  # it is still being brought to green (the runner is slower and has surfaced
  # timing assumptions Linux never hit), and that is tracked separately from
  # the release pipeline. Nothing depends on this job.
  test-macos:
    name: Test (macos-latest)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --no-fail-fast

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install ALSA development headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  crate:
    name: Crate package
    # A crate that cannot pass its own tests is not worth packaging.
    needs: test-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install ALSA development headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --dry-run --locked
      - name: Check the package clears the 10 MB crates.io cap
        run: |
          # cargo publish --dry-run does NOT leave a .crate behind; only
          # cargo package writes one. --no-verify skips a second
          # verification build, which the dry run above already did.
          cargo package --locked --no-verify
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name'] == 'tenuto'))")
          crate=target/package/tenuto-$version.crate
          test -f "$crate" || { echo "no .crate at $crate"; exit 1; }
          size=$(stat -c%s "$crate")
          echo "$crate is $size bytes"
          test "$size" -lt 10485760

  linux-packages:
    name: Linux packages
    # Eleven jobs — a container build plus ten distro installs — so they wait
    # on the Linux suite rather than run beside a red one. Costs the suite's
    # few minutes on a green run; saves the whole matrix on a red one.
    needs: test-linux
    uses: ./.github/workflows/package.yml
    with:
      sha: ${{ github.sha }}

  release-scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/release/test.sh
      # Stubs check only the arguments the spec lists; this runs the real gh
      # against this repository so a wrong flag fails here, not at a tag.
      - name: Live rehearsal-lookup probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          bash scripts/release/find-rehearsal.sh 0000000000000000000000000000000000000000
          code=$?
          set -e
          echo "find-rehearsal exited $code"
          test "$code" -eq 1
