name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install ALSA development headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            blocking: true
          # Linux is the verified platform. The macOS leg reports but does
          # not gate: it is still being brought to green (the runner is
          # slower and has surfaced timing assumptions Linux never hit),
          # and that is tracked separately from the release pipeline.
          - os: macos-latest
            blocking: false
    continue-on-error: ${{ !matrix.blocking }}
    steps:
      - uses: actions/checkout@v6
      - name: Install ALSA development headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
      # --no-fail-fast: cargo otherwise stops at the first test binary that
      # fails, so a red leg only ever showed its first failing binary and
      # hid whatever the later ones would have reported.
      - run: cargo test --locked --no-fail-fast

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install ALSA development headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  crate:
    name: Crate package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install ALSA development headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --dry-run --locked
      - name: Check the package clears the 10 MB crates.io cap
        run: |
          # cargo publish --dry-run does NOT leave a .crate behind; only
          # cargo package writes one. --no-verify skips a second
          # verification build, which the dry run above already did.
          cargo package --locked --no-verify
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name'] == 'tenuto'))")
          crate=target/package/tenuto-$version.crate
          test -f "$crate" || { echo "no .crate at $crate"; exit 1; }
          size=$(stat -c%s "$crate")
          echo "$crate is $size bytes"
          test "$size" -lt 10485760

  linux-packages:
    name: Linux packages
    uses: ./.github/workflows/package.yml
    with:
      sha: ${{ github.sha }}

  release-scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/release/test.sh
      # Stubs check only the arguments the spec lists; this runs the real gh
      # against this repository so a wrong flag fails here, not at a tag.
      - name: Live rehearsal-lookup probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          bash scripts/release/find-rehearsal.sh 0000000000000000000000000000000000000000
          code=$?
          set -e
          echo "find-rehearsal exited $code"
          test "$code" -eq 1
