[package]
name         = "tenuto"
version      = "0.2.0"
edition      = "2024"
rust-version = "1.98.1"
description  = "A keyboard-first terminal audio player for local files, HTTP media and podcasts"
license      = "MIT"
repository   = "https://github.com/alvytsk/tenuto"
readme       = "README.md"
keywords     = ["audio", "player", "podcast", "tui", "terminal"]
categories   = ["multimedia::audio", "command-line-utilities"]
authors      = ["Alexey Vymyatnin <alvy.tsk@gmail.com>"]
exclude      = ["/tests", "/docs", "/.github", "/.claude", "/rust-toolchain.toml", "/scripts"]

[package.metadata.deb]
section              = "sound"
priority             = "optional"
revision             = "1"
depends              = "$auto, ca-certificates"
extended-description = "Plays local files, HTTP media, live radio and podcast episodes from the terminal, and resumes each where you stopped."
assets = [
  ["target/release/tenuto", "usr/bin/", "755"],
  ["README.md", "usr/share/doc/tenuto/", "644"],
  ["CHANGELOG.md", "usr/share/doc/tenuto/", "644"],
  ["LICENSE", "usr/share/doc/tenuto/", "644"],
]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
percent-encoding = "2"
time = { version = "0.3", features = ["serde", "serde-well-known"] }
symphonia = { version = "0.6.1", features = ["mp3", "aac", "isomp4", "alac"] }
cpal = "0.18.2"
rtrb = "0.4.0"
rubato = "5.0.0"
crossbeam-channel = "0.5.17"
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
directories = "6"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
http = "1"
getrandom = "0.4"
quick-xml = { version = "0.42", default-features = false, features = ["encoding"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
ratatui-image = { version = "11.0.8", default-features = false, features = ["crossterm"] }
rustfft = "6.4.1"
unicode-width = "0.2.2"
resvg = { version = "0.48", default-features = false }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.4"
gag = "1.0.0"

[dev-dependencies]
tempfile = "3"
socket2 = "0.6"
portable-pty = "0.9.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
